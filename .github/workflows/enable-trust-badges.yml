name: Enable Global trust badges

on:
  push:
    paths:
      - .github/workflows/enable-trust-badges.yml

permissions:
  contents: write

jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wire badges into production build
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('build-v11.js')
          s=p.read_text()
          copy_anchor="    'i18n-v11.js',\n  ]) {"
          if "    'trust-badges.js',\n" not in s:
              if copy_anchor not in s:
                  raise SystemExit('Global build copy-list anchor not found')
              s=s.replace(copy_anchor,"    'i18n-v11.js',\n    'trust-badges.js',\n  ]) {",1)
          inject="""  // Shared Mother AI verification and PropData infrastructure badges.\n  if (!html.includes('src=\"/trust-badges.js\"')) {\n    html = html.replace('</body>', '<script src=\"/trust-badges.js\" defer></script></body>');\n  }\n\n"""
          write_anchor='  fs.writeFileSync(htmlPath, html);\n'
          if 'Shared Mother AI verification and PropData infrastructure badges.' not in s:
              if write_anchor not in s:
                  raise SystemExit('Global build write anchor not found')
              s=s.replace(write_anchor,inject+write_anchor,1)
          p.write_text(s)
          PY
          node --check build-v11.js
          node --check trust-badges.js
          npm run build
          test -f dist/trust-badges.js
          grep -q 'src="/trust-badges.js"' dist/index.html
      - name: Commit rollout
        shell: bash
        run: |
          git config user.name "PropData Global Build Bot"
          git config user.email "buildbot@proptechusa.ai"
          git rm .github/workflows/enable-trust-badges.yml
          git add build-v11.js trust-badges.js
          git diff --cached --check
          git commit -m "Add Mother AI and PropData badges to Global"
          git push origin HEAD:main
